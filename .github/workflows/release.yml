name: release

# Builds the engine on every platform and publishes the packages as a GitHub
# Release when a version tag (v*) is pushed. The packages contain OpenDay only;
# no file of the original game is ever part of a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Windows x64
            os: windows-latest
            configure: ''
          - name: Linux x64
            os: ubuntu-latest
            configure: ''

    steps:
      - uses: actions/checkout@v5

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The fetched, pinned SDL3 and SQLite are linked statically, so the
      # packages do not depend on libraries installed on the build machine.
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DCMAKE_DISABLE_FIND_PACKAGE_SQLite3=ON
          -DOPENDAY_PACKAGE_VERSION=${{ steps.version.outputs.version }}
          ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Through CMake: on Windows runners "cpack" may be Chocolatey's tool.
      - name: Package
        run: cmake --build build --config Release --target package

      # Apple Silicon refuses ("damaged") binaries whose signature is invalid.
      - name: Verify code signatures (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p verify && cd verify
          ditto -x -k ../build/packages/*.zip .
          codesign --verify --strict --verbose=2 */OpenDay.app
          for tool in */tools/*; do codesign --verify --strict --verbose=2 "$tool"; done

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            build/packages/*.zip
            build/packages/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenDay $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Engine only: you need your own copy of the original game (see README.md). Unofficial project, not affiliated with the original publisher."
