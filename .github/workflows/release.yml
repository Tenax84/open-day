name: release

# Builds the engine on every platform and publishes the packages as a GitHub
# Release when a version tag (v*) is pushed. The packages contain OpenDay only;
# no file of the original game is ever part of a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Windows x64
            os: windows-latest
            configure: ''
          - name: Linux x64
            os: ubuntu-latest
            configure: ''

    steps:
      - uses: actions/checkout@v5

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The fetched, pinned SDL3 and SQLite are linked statically, so the
      # packages do not depend on libraries installed on the build machine.
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DCMAKE_DISABLE_FIND_PACKAGE_SQLite3=ON
          -DOPENDAY_PACKAGE_VERSION=${{ steps.version.outputs.version }}
          ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # The Windows package is an NSIS installer; makensis is usually on the
      # runner image already.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      # Through CMake: on Windows runners "cpack" may be Chocolatey's tool.
      - name: Package
        run: cmake --build build --config Release --target package

      # Apple Silicon refuses ("damaged") binaries whose signature is invalid.
      - name: Verify code signatures (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint verify build/packages/*.dmg
          ls -l verify
          test -L verify/Applications
          codesign --verify --strict --verbose=2 verify/OpenDay.app
          for tool in verify/tools/*; do codesign --verify --strict --verbose=2 "$tool"; done
          hdiutil detach verify

      # Silent install into a scratch folder, a start of the installed program
      # (usage error: exit code 2, message on stderr), then silent uninstall.
      - name: Check the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem build/packages/*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'OpenDay'
          $p = Start-Process $installer -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          Get-ChildItem -Recurse $dir | Select-Object -ExpandProperty FullName
          foreach ($f in 'openday.exe', 'tools\mdbtool.exe', 'LICENSE', 'Uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          # Redirected, so PowerShell waits for the GUI-subsystem program.
          $PSNativeCommandUseErrorActionPreference = $false
          $usage = & (Join-Path $dir 'openday.exe') --not-an-option 2>&1 | Out-String
          $usage
          if ($LASTEXITCODE -ne 2 -or $usage -notmatch 'usage: openday') { throw 'openday.exe did not start' }
          # The uninstaller copies itself to TEMP and returns at once.
          Start-Process (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir 'openday.exe')); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir 'openday.exe')) { throw 'uninstall left openday.exe behind' }
          exit 0 # not the expected exit code 2 of openday.exe

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            build/packages/*.dmg
            build/packages/*.exe
            build/packages/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      # Checksums for the updater (docs/updates.md); GitHub's own asset
      # digests are preferred, this file is the fallback.
      - name: Checksums
        working-directory: dist
        run: sha256sum OpenDay-* > SHA256SUMS && cat SHA256SUMS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenDay $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Engine only: you need your own copy of the original game (see README.md). Unofficial project, not affiliated with the original publisher."
